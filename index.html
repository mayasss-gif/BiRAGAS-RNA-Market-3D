  charts(){reg(new Chart(sgC,{type:'bar',data:{labels:seg_.map(s=>seg(s.seg)),datasets:[{data:seg_.map(s=>s.rev/1e6),backgroundColor:seg_.map((_,i)=>rgba(PAL[i%PAL.length],.78)),borderColor:seg_.map((_,i)=>PAL[i%PAL.length]),borderWidth:1,borderRadius:6}]},options:{indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>M(c.parsed.x*1e6)}}},scales:{x:{title:{display:true,text:'$M / yr'}}}}}));}},
 geography:{label:'Geography',title:'Global Coverage',sub:'197 US + 183 international across 40+ countries',render(){const rows=DATA.countries.map((c,i)=>`<tr><td><span style="color:${PAL[i%PAL.length]}">●</span> ${c[0]}</td><td class="r">${c[1]}</td></tr>`).join('');return `

  charts(){reg(new Chart(gS,{type:'doughnut',data:{labels:['US','International'],datasets:[{data:[DATA.by_region.US,DATA.by_region.non_US],backgroundColor:[rgba(C.cyan,.8),rgba(C.grn,.8)],borderColor:'rgba(255,255,255,.3)'}]},options:{plugins:{legend:{position:'bottom'}},cutout:'62%'}}));
   reg(new Chart(gC,{type:'bar',data:{labels:DATA.countries.map(c=>c[0]),datasets:[{data:DATA.countries.map(c=>c[1]),backgroundColor:DATA.countries.map((_,i)=>rgba(PAL[i%PAL.length],.78)),borderColor:DATA.countries.map((_,i)=>PAL[i%PAL.length]),borderWidth:1,borderRadius:5}]},options:{plugins:{legend:{display:false}},scales:{y:{title:{display:true,text:'institutions'}}}}}));}},
 contacts:{label:'Contacts',title:'Verified Decision-Makers',sub:'RNA-seq core directors, bioinformaticians & computational biologists',render(){const rows=DATA.priority.map(p=>`<tr><td>${p.name}</td><td>${seg(p.seg)}</td><td class="r">${usd(p.rev)}</td><td class="r">${p.contacts}</td></tr>`).join('');return `
  <div class="card"><h2>📇 Contact base</h2><div class="metric">${DATA.contacts_total.toLocaleString()}</div><p class="sub">verified · emails · phones · LinkedIn</p>
   <div class="kpis"><div class="kpi"><div class="v">${DATA.email_status.valid}</div><div class="l">Valid</div></div><div class="kpi"><div class="v">${DATA.email_status['catch-all']}</div><div class="l">Catch-all</div></div></div></div>
  <div class="card"><h2>✅ Deliverability</h2><canvas id="cS" class="chart"></canvas><p class="sub" style="margin-top:6px">Send to <b style="color:var(--grn)">valid</b> first.</p></div>
  <div class="card"><h2>🧭 Who to target</h2><h3>Core facilities</h3><p class="sub">Core Director · Head of Bioinformatics · Genomics Platform Manager</p><h3>Pharma / biotech</h3><p class="sub">Head of Computational Biology · Functional Genomics</p><h3>Clinical</h3><p class="sub">Lab / Medical Director · Molecular Pathology</p></div>
  <div class="card span2"><h2>🚀 Priority targets</h2><div class="scroll"><table class="dt"><thead><tr><th>Institution</th><th>Segment</th><th class="r">Potential/yr</th><th class="r">Contacts</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;},

 accounts:{label:'Top Accounts',title:'Highest-Value Accounts',sub:'Ranked by module-based revenue potential',render(){const rows=DATA.top.map((a,i)=>`<tr><td>${i+1}</td><td>${a.name}</td><td>${a.region}</td><td><span class="pill ${a.tier==='Platform'?'':'grn'}">${a.tier}</span></td><td class="r">${usd(a.rev)}</td></tr>`).join('');return `

  charts(){const t=DATA.top.slice().reverse();reg(new Chart(aC,{type:'bar',data:{labels:t.map(a=>a.name),datasets:[{data:t.map(a=>a.rev/1e6),backgroundColor:t.map(a=>rgba(a.tier==='Platform'?C.cyan:C.grn,.78)),borderColor:t.map(a=>a.tier==='Platform'?C.cyan:C.grn),borderWidth:1,borderRadius:5}]},options:{indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>M(c.parsed.x*1e6)}}},scales:{x:{title:{display:true,text:'$M / yr'}}}}}));}},
};
const order=['overview','market','projection','modules','segments','geography','contacts','accounts'];
const tabsEl=document.getElementById('tabs');
order.forEach((k,i)=>{const d=document.createElement('div');d.className='tab'+(i===0?' active':'');d.textContent=VIEWS[k].label;d.dataset.k=k;tabsEl.appendChild(d);});
function show(k){clr();document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.k===k));const v=VIEWS[k];document.getElementById('viewTitle').innerHTML=`<h1>${v.title}</h1><p>${v.sub}</p>`;document.getElementById('dashboard').innerHTML=v.render();requestAnimationFrame(()=>v.charts());}
const audio=document.getElementById('narrationAudio');const nbtn=document.getElementById('narrate');const abtn=document.getElementById('autoNarrate');let auto=true;
function loadNarr(k,play){audio.src='audio/'+k+'.mp3';nbtn.textContent='🔊 Play Narration';if(play&&auto){audio.play().then(()=>nbtn.textContent='⏸ Pause Narration').catch(()=>{});}}
nbtn.onclick=()=>{if(audio.paused){audio.play().then(()=>nbtn.textContent='⏸ Pause Narration').catch(()=>{});}else{audio.pause();nbtn.textContent='🔊 Play Narration';}};
audio.addEventListener('ended',()=>nbtn.textContent='🔊 Play Narration');audio.addEventListener('play',()=>nbtn.textContent='⏸ Pause Narration');audio.addEventListener('pause',()=>{if(!audio.ended)nbtn.textContent='🔊 Play Narration';});
abtn.onclick=function(){auto=!auto;this.textContent='Auto-Narrate: '+(auto?'On':'Off');if(!auto)audio.pause();};
tabsEl.addEventListener('click',e=>{const t=e.target.closest('.tab');if(t){show(t.dataset.k);audio.pause();loadNarr(t.dataset.k,true);}});show('overview');loadNarr('overview',false);
// Three.js bg
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('bg'),alpha:true,antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
scene.add(new THREE.AmbientLight(0x406060,0.6));const dl=new THREE.DirectionalLight(0xffffff,0.7);dl.position.set(1,1,1);scene.add(dl);
const pl=new THREE.PointLight(0x00f7ff,1,100);pl.position.set(0,0,6);scene.add(pl);const pl2=new THREE.PointLight(0x00ff9d,0.8,100);pl2.position.set(-6,3,2);scene.add(pl2);
const pg=new THREE.BufferGeometry();const NP=1400;const pos=new Float32Array(NP*3);for(let i=0;i<NP*3;i++)pos[i]=(Math.random()-0.5)*16;pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const particles=new THREE.Points(pg,new THREE.PointsMaterial({size:0.03,color:0x00f7ff,transparent:true,opacity:0.7}));scene.add(particles);
// RNA-style double helix
const helix=new THREE.Group();for(let i=0;i<80;i++){const a=i*0.35,y=i*0.1-4;for(const[off,col] of [[0,0x00f7ff],[Math.PI,0x00ff9d]]){const s=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8),new THREE.MeshBasicMaterial({color:col}));s.position.set(Math.cos(a+off)*1.0+3.5,y,Math.sin(a+off)*1.0-3);helix.add(s);}}scene.add(helix);
const ico=new THREE.Mesh(new THREE.IcosahedronGeometry(1.1,1),new THREE.MeshPhongMaterial({color:0x00ff9d,transparent:true,opacity:0.32,wireframe:true}));ico.position.set(-4,1.2,-3);scene.add(ico);
const torus=new THREE.Mesh(new THREE.TorusGeometry(1.5,0.3,16,100),new THREE.MeshPhongMaterial({color:0x00f7ff,transparent:true,opacity:0.4,wireframe:true}));torus.position.set(3.2,-2,-4);scene.add(torus);
camera.position.z=6;const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;controls.enablePan=false;controls.minDistance=3;controls.maxDistance=12;controls.autoRotate=true;controls.autoRotateSpeed=0.6;
let paused=false,t=0;function animate(){requestAnimationFrame(animate);if(!paused){t+=0.01;helix.rotation.y=t*0.5;ico.rotation.y=-t*0.8;ico.rotation.x=t*0.5;torus.rotation.x=t;particles.rotation.y=t*0.25;pl.intensity=1+Math.sin(t*2)*0.3;}controls.update();renderer.render(scene,camera);}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
document.getElementById('resetView').onclick=()=>{camera.position.set(0,0,6);controls.reset();};
document.getElementById('toggleAnimation').onclick=function(){paused=!paused;this.textContent=paused?'Resume Motion':'Pause Motion';};
document.getElementById('toggleRotate').onclick=function(){controls.autoRotate=!controls.autoRotate;this.textContent='Auto-Rotate: '+(controls.autoRotate?'On':'Off');};
</script></body></html>
